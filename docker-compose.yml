version: "3.9"

services:
  localai:
    image: localai/localai:latest
    container_name: localai
    ports:
      - "8080:8080"
    environment:
      - DEBUG=true
      - MODELS_PATH=/models
    volumes:
      - ./models:/models
    command: ["/usr/bin/local-ai", "run", "--models-path", "/models", "--threads", "4"]

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - LOCALAI_BASE_URL=http://localai:8080/v1
      - TZ=Asia/Taipei
    volumes:
      - ./n8n-data:/home/node/.n8n
    depends_on:
      - localai
